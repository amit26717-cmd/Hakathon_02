{% extends "base.html" %}
{% block title %}Register – Sahyog Setu{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Create an account</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">I am a</label>
            <select name="role" class="form-select" required>
              <option value="parent">Parent (need childcare)</option>
              <option value="elder">Elder (can offer care and activities)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 6 characters)</label>
            <input type="password" name="password" class="form-control" minlength="6" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Emergency contact</label>
              <input type="text" name="emergency_contact" class="form-control">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="address" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Health info (for emergencies)</label>
            <textarea name="health_info" class="form-control" rows="2"
                      placeholder="Allergies, medication, conditions"></textarea>
          </div>
          <button class="btn btn-success w-100" type="submit">Register</button>
        </form>
        <p class="text-center mt-3 mb-0 small">
          Already registered? <a href="{{ url_for('login') }}">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
